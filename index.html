<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>📱 Tetris Mobile</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>📱 Tetris Mobile</h1>
      <p class="subtitle">Optimiert für Touch & Tastatur</p>
    </header>

    <section class="game-shell">
      <canvas id="tetris" width="300" height="600" aria-label="Tetris Spielfeld"></canvas>

      <aside class="panel">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Level</span><strong id="level">1</strong></div>
        <div class="stat"><span>Linien</span><strong id="lines">0</strong></div>

        <div class="buttons">
          <button id="startBtn">Start</button>
          <button id="pauseBtn">Pause</button>
          <button id="resetBtn">Neu</button>
        </div>

        <p id="status" class="status">Tippe auf Start.</p>
      </aside>
    </section>

    <section class="controls" aria-label="Touch Steuerung">
      <button class="ctrl" data-action="left">◀</button>
      <button class="ctrl" data-action="rotate">⟳</button>
      <button class="ctrl" data-action="right">▶</button>
      <button class="ctrl" data-action="softDrop">▼</button>
      <button class="ctrl drop" data-action="hardDrop">⤓</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
